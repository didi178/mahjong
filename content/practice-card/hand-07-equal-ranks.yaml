# Hand 7: Equal ranks across suits
# Coverage: equal(ranks), three-suit, full 1-9 domain

id: hand-07-equal-ranks
name: "Same Rank - Three Suits"
concealed: false

variables:
  S1:
    type: suit
  S2:
    type: suit
  S3:
    type: suit
  R:
    type: rank

groups:
  - kind: pung
    tile:
      suit: S1
      rank: R
    joker_allowed: true

  - kind: pung
    tile:
      suit: S2
      rank: R
    joker_allowed: true

  - kind: kong
    tile:
      suit: S3
      rank: R
    joker_allowed: true

  - kind: pair
    tile:
      honor: wind
      direction: west
    joker_allowed: false

constraints:
  - type: distinct
    vars: [S1, S2, S3]
