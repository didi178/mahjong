# Hand 8: Consecutive with step > 1
# Coverage: consecutive with step=2 (non-1 step), single-suit

id: hand-08-consecutive-step2
name: "Skip-One Sequence"
concealed: false

variables:
  S:
    type: suit
  R1:
    type: rank
  R2:
    type: rank
  R3:
    type: rank
  R4:
    type: rank

groups:
  - kind: pair
    tile:
      suit: S
      rank: R1
    joker_allowed: false

  - kind: pair
    tile:
      suit: S
      rank: R2
    joker_allowed: false

  - kind: pair
    tile:
      suit: S
      rank: R3
    joker_allowed: false

  - kind: pair
    tile:
      suit: S
      rank: R4
    joker_allowed: false

  - kind: pung
    tile:
      honor: dragon
      color: green
    joker_allowed: true

  - kind: pung
    tile:
      flower: 2
    joker_allowed: false

constraints:
  - type: consecutive
    vars: [R1, R2, R3, R4]
    step: 2
